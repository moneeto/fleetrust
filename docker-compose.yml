version: '3.8'

services:
  # ----------------------------------
  # 1. SERVICIO BACKEND (Node.js/Express)
  # ----------------------------------
  backend:
    container_name: frassi_backend
    build:
      context: ./backend             # Directorio donde está el código
      dockerfile: Dockerfile.prod    # Usamos la imagen de producción como base
    ports:
      - "8000:8000"                  # Mapeo de puertos: host:contenedor
    volumes:
      - ./backend:/usr/src/app       # Sincroniza el código local con el contenedor
      # - /usr/src/app/node_modules    # Excluye la carpeta node_modules (para no sobreescribir las dependencias instaladas)
    environment:
      # Variables de entorno para tu backend (ej: conexión a DB)
      NODE_ENV: development
    command: npm run dev
    # Reemplaza 'npm run dev' con 'nodemon server.js' si no tienes un script dev definido

  # ----------------------------------
  # 2. SERVICIO FRONTEND (React/Vue/Vite)
  # ----------------------------------
  frontend:
    container_name: frassi_frontend
    build:
      context: ./frontend            # Directorio donde está el código
      dockerfile: Dockerfile.dev     # Usamos el Dockerfile.dev que tiene solo la instalación
    ports:
      - "3000:3000"                  # Mapeo del puerto de tu servidor de desarrollo (ej. Vite usa 5173)
    volumes:
      - ./frontend:/app              # Sincroniza el código local con el contenedor
      # - ./frontend/node_modules:/app/node_modules  # usa tu node_modules local
    environment:
      # Esto ayuda a que el HMR (Hot Reload) detecte cambios en algunos sistemas operativos
      CHOKIDAR_USEPOLLING: true
      # Si tu frontend necesita saber dónde está el backend:
      VITE_API_URL: http://backend:9000 # Usa el nombre del servicio 'backend' como hostname interno
    command: npm run dev
    depends_on:
      - backend                      # Asegura que el backend se inicie primero


    # ---------------- PARA FAUSTO Y JOAQUIN ----------------------
    # Comando para construir y levantar los contenedores de desarrollo:
    
    # PARA LEVANTARLO: docker compose up
    # PARA FRENARLO: docker compose down

    # (Docker por default busca el docker-compose.yml, que en este caso va a ser para desarrollo).