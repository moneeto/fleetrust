services:
  mysql:
    image: mariadb:10.11
    container_name: fleetrust-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: fleetrust
    volumes:
      - fleetrust_mysql_data:/var/lib/mysql

volumes:
  fleetrust_mysql_data:
